name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JS deps
        run: npm ci

      - name: Typecheck (node/web/firefox)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test

      - name: Lint Firefox extension
        run: npm run build:firefox:extension && npx web-ext lint --source-dir dist/firefox-extension

      - name: Build dual
        run: npm run build:dual

      - name: Python sidecar syntax check
        run: python -m py_compile src/ai/local/server.py src/ai/local/hardware.py

      - name: Python hardware profile tests
        run: python -m unittest discover -s src/ai/local -p "test_*.py"

      - name: Hardware profile resolution smoke test
        run: python src/ai/local/server.py --print-profile

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueberry-xpi
          path: dist/*.zip
          if-no-files-found: warn
