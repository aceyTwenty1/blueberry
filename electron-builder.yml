appId: com.blueberry.browser
productName: Blueberry
directories:
  buildResources: resources
  output: dist
files:
  - out
  - resources
  - '!**/*.ts'
  - '!**/*.map'
win:
  target: nsis
  icon: resources/icon.png
mac:
  target: dmg
  icon: resources/icon.png
linux:
  target: AppImage
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
